<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- skill dir -->
  <rect x="30" y="60" width="200" height="190" rx="10" fill="#f0f7f0" stroke="#4a8c4a"/>
  <text x="130" y="86" text-anchor="middle" fill="#2a5c2a" font-weight="bold">技能目录（一层扫描）</text>
  <rect x="50" y="100" width="160" height="30" rx="5" fill="#fff" stroke="#7ab97a"/>
  <text x="130" y="120" text-anchor="middle" fill="#2a5c2a">code-review/SKILL.md</text>
  <rect x="50" y="140" width="160" height="30" rx="5" fill="#fff" stroke="#7ab97a"/>
  <text x="130" y="160" text-anchor="middle" fill="#2a5c2a">sql-tuning/SKILL.md</text>
  <rect x="50" y="180" width="160" height="30" rx="5" fill="#fff" stroke="#d0a0a0" stroke-dasharray="4 3"/>
  <text x="130" y="200" text-anchor="middle" fill="#a05050">broken/SKILL.md → Issue</text>

  <!-- Load -->
  <rect x="300" y="95" width="200" height="120" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="122" text-anchor="middle" fill="#2e7d32" font-weight="bold">Load(root, opts...)</text>
  <text x="400" y="146" text-anchor="middle" fill="#333">frontmatter 子集解析（无 yaml）</text>
  <text x="400" y="166" text-anchor="middle" fill="#333">重名遮蔽 → Issue；catalog 超限 → 硬错</text>
  <text x="400" y="192" text-anchor="middle" fill="#777">纯构造，无副作用</text>

  <!-- Set -->
  <rect x="570" y="95" width="150" height="120" rx="10" fill="#f3edf7" stroke="#7e57a4"/>
  <text x="645" y="122" text-anchor="middle" fill="#4a2d6b" font-weight="bold">Set（不可变）</text>
  <text x="645" y="146" text-anchor="middle" fill="#4a2d6b">skills 按名排序</text>
  <text x="645" y="166" text-anchor="middle" fill="#4a2d6b">byName map → Body</text>
  <text x="645" y="192" text-anchor="middle" fill="#777">Skills()/Issues() 克隆</text>

  <!-- distributor -->
  <rect x="300" y="290" width="420" height="110" rx="10" fill="#eef3fb" stroke="#5b7fb5"/>
  <text x="510" y="316" text-anchor="middle" fill="#1a3a63" font-weight="bold">distributor 工具（名字默认 "skill"）</text>
  <text x="510" y="340" text-anchor="middle" fill="#333">Info().Description = catalog（"code-review — …；sql-tuning — …"）</text>
  <text x="510" y="362" text-anchor="middle" fill="#333">Execute({"name"}) → 正文原样返回 · 永不 Go error · Data=nil · 免审批</text>
  <text x="510" y="386" text-anchor="middle" fill="#a94442" font-size="12">坏参数 / 未知名字 → 软错误，模型自纠</text>

  <!-- registry + loop -->
  <rect x="770" y="290" width="130" height="110" rx="10" fill="#f6f8fa" stroke="#888"/>
  <text x="835" y="318" text-anchor="middle" font-weight="bold" fill="#333">tool.Registry</text>
  <text x="835" y="342" text-anchor="middle" fill="#333">Register 一个工具</text>
  <text x="835" y="366" text-anchor="middle" fill="#333">agent 循环 List/Get</text>
  <text x="835" y="388" text-anchor="middle" fill="#777" font-size="12">刷新 = 重 Load + Replace</text>

  <!-- edges -->
  <line x1="230" y1="150" x2="296" y2="152" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="500" y1="150" x2="566" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="620" y1="219" x2="560" y2="286" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="560" y="250" text-anchor="middle" fill="#555" font-size="12">Set.Tool()</text>
  <line x1="720" y1="345" x2="766" y2="345" stroke="#444" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="743" y="332" text-anchor="middle" fill="#555" font-size="12">注册</text>
</svg>
