name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build + vet
        run: |
          go build ./...
          go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        run: go test -race -shuffle=on -count=1 ./agent ./store
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  kernel-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: kernel closure guard
        run: bash scripts/kernel-closure-guard.sh
      - name: readme contract
        run: bash scripts/check-readme-contract.sh
